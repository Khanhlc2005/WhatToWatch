services:
  mysql:
    image: mysql:8.0
    container_name: whattowatch-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: whattowatch_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./data/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - whattowatch-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: whattowatch-backend
    restart: always
    depends_on:
      - mysql
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/whattowatch_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    networks:
      - whattowatch-network

volumes:
  mysql_data:

networks:
  whattowatch-network:
    driver: bridge