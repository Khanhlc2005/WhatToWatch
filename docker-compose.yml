services:
  ai-service:
    profiles: ["ai"]
    build:
      context: .
      dockerfile: ai-service/Dockerfile
    ports:
      - "127.0.0.1:8010:8010"
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-movies}
      EMBEDDING_MODEL_NAME: BAAI/bge-m3
      EMBEDDING_MODEL_PATH: ${EMBEDDING_MODEL_PATH:-}
      EMBEDDING_DEVICE: cpu
      EMBEDDING_CPU_THREADS: ${EMBEDDING_CPU_THREADS:-4}
      RERANKER_MODEL_NAME: ${RERANKER_MODEL_NAME:-BAAI/bge-reranker-v2-m3}
      RERANKER_MODEL_PATH: ${RERANKER_MODEL_PATH:-}
      RERANKER_DEVICE: ${RERANKER_DEVICE:-cpu}
      RETRIEVAL_CANDIDATE_K: ${RETRIEVAL_CANDIDATE_K:-50}
      RETRIEVAL_FINAL_K: ${RETRIEVAL_FINAL_K:-10}
      RECOMMENDATION_SIMILARITY_WEIGHT: ${RECOMMENDATION_SIMILARITY_WEIGHT:-0.8}
      RECOMMENDATION_IMDB_WEIGHT: ${RECOMMENDATION_IMDB_WEIGHT:-0.2}
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-0}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL_NAME: qwen2.5:3b
      OLLAMA_READ_TIMEOUT_SECONDS: ${OLLAMA_READ_TIMEOUT_SECONDS:-300}
      BACKEND_BASE_URL: http://backend:8080/movie-recommendation
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - whattowatch_model_cache:/home/app/.cache/huggingface
      - ./data/model_cache:/model-cache:ro
    depends_on:
      - qdrant
    networks:
      - whattowatch-network

  ollama-proxy:
    profiles: ["ai-local"]
    build:
      context: ./tools/ollama-proxy
    network_mode: host
    command:
      - TCP-LISTEN:11435,bind=${OLLAMA_PROXY_BIND:-172.17.0.1},reuseaddr,fork
      - TCP:127.0.0.1:11434
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.19.0
    ports:
      - "127.0.0.1:${QDRANT_HOST_PORT:-6335}:6333"
    volumes:
      - whattowatch_qdrant_data:/qdrant/storage
    networks:
      - whattowatch-network

  mysql:
    image: mysql:8.0
    container_name: whattowatch-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: whattowatch_db
    ports:
      - "${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./data/mysql/movies_data.sql:/docker-entrypoint-initdb.d/01-movies_data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 15
    networks:
      - whattowatch-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: whattowatch-backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/whattowatch_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SERVER_SERVLET_CONTEXT_PATH: /movie-recommendation
      AI_SERVICE_URL: http://ai-service:8010
      AI_SERVICE_SEARCH_TIMEOUT_SECONDS: ${AI_SERVICE_SEARCH_TIMEOUT_SECONDS:-120}
      AI_SERVICE_CHAT_TIMEOUT_SECONDS: ${AI_SERVICE_CHAT_TIMEOUT_SECONDS:-390}
    networks:
      - whattowatch-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      BACKEND_URL: http://backend:8080/movie-recommendation
    depends_on:
      - backend
    networks:
      - whattowatch-network

volumes:
  whattowatch_model_cache:
  whattowatch_qdrant_data:
  mysql_data:

networks:
  whattowatch-network:
    driver: bridge
