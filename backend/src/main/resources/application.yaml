server:
  port: 8080
  servlet:
    context-path: /movie-recommendation



spring:
  application:
    name: movie-recommendation
  datasource:
    url: "${DB_URL:jdbc:mysql://localhost:3306/movie-recommendation}"
    username: "${DB_USERNAME:root}"
    password: "${DB_PASSWORD:root}"
  jpa:
    hibernate:
      ddl-auto: update
      show-sql: true

jwt:
  signerKey: "${JWT_SIGNER_KEY:local-dev-signing-key-change-before-deployment-0123456789abcdef0123456789abcdef}"

app:
  demo-data:
    enabled: ${APP_DEMO_DATA_ENABLED:false}
