<!doctype html>
<html>
<head><meta charset="utf-8"><title>MovieDetail — preview</title>
<script src="../demo-data.js"></script>
<style>body{padding:24px;padding:0}</style></head>
<body>
<div id="root"></div>
<script>
  var W = window.WTW, h = React.createElement, D = window.WTW_DEMO, M = D.movies;
  function stack() { return h.apply(null, ['div', { style: { display: 'flex', flexDirection: 'column', gap: 16, alignItems: 'flex-start' } }].concat([].slice.call(arguments))); }
  function line() { return h.apply(null, ['div', { style: { display: 'flex', flexWrap: 'wrap', gap: 12, alignItems: 'center' } }].concat([].slice.call(arguments))); }
  ReactDOM.createRoot(document.getElementById('root')).render(
    h(W.MovieDetail, { inline: true, movie: Object.assign({}, M[0], { myRating: 5, favorite: true }), trailer: 'none', similar: M.slice(1, 7), listsOpen: true, lists: [{ id: 'l1', name: 'Sunday classics', count: 5, checked: true }, { id: 'l2', name: 'Date night', count: 0 }, { id: 'l3', name: 'Studio Ghibli marathon', count: 1 }] })
  );
</script>
</body>
</html>
