<!doctype html>
<html>
<head><meta charset="utf-8"><title>StatusNote — preview</title>
<script src="../demo-data.js"></script>
<style>body{padding:24px;}</style></head>
<body>
<div id="root"></div>
<script>
  var W = window.WTW, h = React.createElement, D = window.WTW_DEMO, M = D.movies;
  function stack() { return h.apply(null, ['div', { style: { display: 'flex', flexDirection: 'column', gap: 16, alignItems: 'flex-start' } }].concat([].slice.call(arguments))); }
  function line() { return h.apply(null, ['div', { style: { display: 'flex', flexWrap: 'wrap', gap: 12, alignItems: 'center' } }].concat([].slice.call(arguments))); }
  ReactDOM.createRoot(document.getElementById('root')).render(
    stack(
      h(W.StatusNote, { tone: 'loading' }, 'Finding movies for you…'),
      h(W.StatusNote, { tone: 'invite', action: h('a', { className: 'w-link', href: '#' }, 'Sign in') }, 'A random selection of top rated IMDb movies. Sign in and rate 3 movies for personalized picks.'),
      h(W.StatusNote, { tone: 'info' }, 'Ranked by your preferences and IMDb rating.'),
      h(W.StatusNote, { tone: 'error' }, 'Recommendations are temporarily unavailable. Please try again later.'),
      h(W.StatusNote, { tone: 'success' }, 'Account created. Please sign in.'),
      h(W.StatusNote, { tone: 'empty', block: true, title: 'This list is empty', action: h(W.Button, { size: 'sm', href: '#' }, 'Explore movies') }, 'Add movies from any movie card or the detail view.'))
  );
</script>
</body>
</html>
