<!doctype html>
<html>
<head><meta charset="utf-8"><title>MovieRow — preview</title>
<script src="../demo-data.js"></script>
<style>body{padding:24px;}</style></head>
<body>
<div id="root"></div>
<script>
  var W = window.WTW, h = React.createElement, D = window.WTW_DEMO, M = D.movies;
  function stack() { return h.apply(null, ['div', { style: { display: 'flex', flexDirection: 'column', gap: 16, alignItems: 'flex-start' } }].concat([].slice.call(arguments))); }
  function line() { return h.apply(null, ['div', { style: { display: 'flex', flexWrap: 'wrap', gap: 12, alignItems: 'center' } }].concat([].slice.call(arguments))); }
  ReactDOM.createRoot(document.getElementById('root')).render(
    h(W.MovieRow, { title: 'For you', stamp: 'PERSONALIZED', count: '8 MOVIES', movies: M.slice(0, 8), reasons: D.reasons, note: h(W.StatusNote, { tone: 'info' }, 'Ranked by your preferences and IMDb rating.') })
  );
</script>
</body>
</html>
