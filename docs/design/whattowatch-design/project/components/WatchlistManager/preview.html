<!doctype html>
<html>
<head><meta charset="utf-8"><title>WatchlistManager — preview</title>
<script src="../demo-data.js"></script>
<style>body{padding:24px;}</style></head>
<body>
<div id="root"></div>
<script>
  var W = window.WTW, h = React.createElement, D = window.WTW_DEMO, M = D.movies;
  function stack() { return h.apply(null, ['div', { style: { display: 'flex', flexDirection: 'column', gap: 16, alignItems: 'flex-start' } }].concat([].slice.call(arguments))); }
  function line() { return h.apply(null, ['div', { style: { display: 'flex', flexWrap: 'wrap', gap: 12, alignItems: 'center' } }].concat([].slice.call(arguments))); }
  ReactDOM.createRoot(document.getElementById('root')).render(
    h(W.WatchlistManager, { selected: 'l1', lists: [
      { id: 'favorites', name: 'Favourite', system: true, count: 12, movies: M.slice(0, 4) },
      { id: 'watchlist', name: 'Watch later', system: true, count: 31, movies: M.slice(3, 8) },
      { id: 'l1', name: 'Sunday classics', count: 4, movies: [M[1], M[0], M[6], M[2]] },
      { id: 'l2', name: 'Date night', count: 0, movies: [] }] })
  );
</script>
</body>
</html>
