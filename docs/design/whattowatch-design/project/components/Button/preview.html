<!doctype html>
<html>
<head><meta charset="utf-8"><title>Button — preview</title>
<script src="../demo-data.js"></script>
<style>body{padding:24px;}</style></head>
<body>
<div id="root"></div>
<script>
  var W = window.WTW, h = React.createElement, D = window.WTW_DEMO, M = D.movies;
  function stack() { return h.apply(null, ['div', { style: { display: 'flex', flexDirection: 'column', gap: 16, alignItems: 'flex-start' } }].concat([].slice.call(arguments))); }
  function line() { return h.apply(null, ['div', { style: { display: 'flex', flexWrap: 'wrap', gap: 12, alignItems: 'center' } }].concat([].slice.call(arguments))); }
  ReactDOM.createRoot(document.getElementById('root')).render(
    stack(
      line(h(W.Button, { variant: 'primary', icon: 'info' }, 'View details'), h(W.Button, { variant: 'secondary', iconRight: 'arrow-up-right' }, 'Create an account'), h(W.Button, { variant: 'ghost' }, 'Cancel'), h(W.Button, { variant: 'ghost-danger', icon: 'trash' }, 'Clear history')),
      line(h(W.Button, { variant: 'primary', size: 'sm' }, 'Search'), h(W.Button, { size: 'sm', icon: 'chevron-left', disabled: true }, 'Previous'), h(W.Button, { variant: 'primary', busy: true, busyLabel: 'Please wait…' }, 'Sign in')))
  );
</script>
</body>
</html>
