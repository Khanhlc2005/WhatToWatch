<!-- @dsCard group="Screens" height=1620 width=1440 page subtitle="/search?q=… — results, empty and no-match states" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>SearchScreen</title>
<script src="../demo-data.js"></script>
<style>body{margin:0}</style></head>
<body>
<div id="root"></div>
<script>
  var W = window.WTW, h = React.createElement, D = window.WTW_DEMO, M = D.movies;
  var USER = { email: 'khanh@example.com' };
  function head(eyebrow, title, lead) { return h('div', { className: 'w-pagehead' }, h('span', { className: 'w-eyebrow' }, eyebrow), h('h1', null, title), lead ? h('p', null, lead) : null); }
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', null,
      h(W.Navbar, { active: 'search', scrolled: true, user: USER }),
      h('main', { className: 'w-page', style: { gap: 32 } },
        head('EXPLORE WHAT TO WATCH', 'Search for a movie'),
        h('div', { style: { maxWidth: 880 } }, h(W.SearchForm, { value: 'the' })),
        h('div', { style: { display: 'flex', alignItems: 'center', justifyContent: 'space-between' } },
          h(W.TicketMeta, { extra: ['38 RESULTS FOR “THE”', 'PAGE 1 / 3'] }),
          h('a', { className: 'w-link', href: '/discover' }, h(W.Icon, { name: 'sliders', size: 16 }), 'Need more control? Try Discover')),
        h('div', { className: 'w-grid' }, [M[0], M[1], M[7], M[4], M[8], M[2], M[6], M[9], M[3], M[5], M[10], M[0], M[4], M[2]].map(function (m) { return h(W.MovieCard, { key: m.id, movie: m }); })),
        h(W.Pagination, { page: 1, totalPages: 3 }),
        h('div', { style: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 24 } },
          h('div', { style: { display: 'flex', flexDirection: 'column', gap: 12 } }, h('span', { className: 'w-eyebrow' }, 'STATE · NOT SEARCHED YET'),
            h(W.StatusNote, { tone: 'info', block: true }, 'Enter a movie title to search the collection.')),
          h('div', { style: { display: 'flex', flexDirection: 'column', gap: 12 } }, h('span', { className: 'w-eyebrow' }, 'STATE · NO MATCHES'),
            h(W.StatusNote, { tone: 'empty', block: true, title: '0 results for “godfathr”', action: h(W.Button, { size: 'sm', href: '/chat', icon: 'message' }, 'Ask Chatbot W2W') }, 'No matching movies found. Try another title.')))),
      h(W.Footer)));
</script>
</body>
</html>
